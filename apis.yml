name: Dermira
description: Dermira was a biopharmaceutical company focused on medical dermatology, developing and
  commercializing treatments for chronic skin conditions such as primary axillary hyperhidrosis
  (Qbrexza / glycopyrronium) and atopic dermatitis (lebrikizumab). Headquartered in Menlo Park,
  California and originally backed by venture investors including Canaan Partners, the company went
  public on NASDAQ (DERM) in 2014 and was acquired by Eli Lilly and Company in 2020. Its assets and
  operations are now part of Eli Lilly; the dermira.com domain redirects to lilly.com. Dermira did not
  operate a public developer program, API, or developer portal, so this profile carries company
  identity only and has no API artifacts to enrich.
